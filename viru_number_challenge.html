<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viru's Number Challenge</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #1e3a8a);
    color: white;
  }
  .game {
    width: min(92%, 430px);
    padding: 28px;
    text-align: center;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 22px;
    box-shadow: 0 15px 45px rgba(0,0,0,.3);
  }
  h1 { margin-top: 0; }
  .number {
    font-size: 4rem;
    font-weight: bold;
    margin: 20px 0;
  }
  input, button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 12px;
    font-size: 1rem;
  }
  input { text-align: center; }
  button {
    cursor: pointer;
    font-weight: bold;
    background: #fbbf24;
    color: #111827;
  }
  button:hover { filter: brightness(1.08); }
  #message { min-height: 28px; margin: 16px 0 8px; font-weight: bold; }
  .stats { display: flex; justify-content: space-around; margin-top: 18px; }
  small { opacity: .75; }
</style>
</head>
<body>
<main class="game">
  <h1>🎮 Number Challenge</h1>
  <p>Guess the secret number between <b>1 and 100</b>.</p>
  <div class="number">❓</div>

  <input id="guess" type="number" min="1" max="100" placeholder="Enter your guess">
  <button id="check">Check Guess</button>
  <button id="restart">🔄 New Game</button>

  <div id="message" aria-live="polite">Good luck, Warrior! ⚔️</div>

  <div class="stats">
    <div>Attempts<br><b id="attempts">0</b></div>
    <div>Best<br><b id="best">—</b></div>
  </div>
  <br>
  <small>Made for Viru</small>
</main>

<script>
let secret = Math.floor(Math.random() * 100) + 1;
let attempts = 0;
let best = null;

const guess = document.getElementById("guess");
const message = document.getElementById("message");
const attemptsEl = document.getElementById("attempts");
const bestEl = document.getElementById("best");

function checkGuess() {
  const value = Number(guess.value);

  if (!Number.isInteger(value) || value < 1 || value > 100) {
    message.textContent = "Please enter a whole number from 1 to 100.";
    return;
  }

  attempts++;
  attemptsEl.textContent = attempts;

  if (value === secret) {
    message.textContent = `🎉 Correct! You won in ${attempts} attempt${attempts === 1 ? "" : "s"}!`;
    if (best === null || attempts < best) {
      best = attempts;
      bestEl.textContent = best;
    }
  } else if (value < secret) {
    message.textContent = "⬆️ Too low! Try a bigger number.";
  } else {
    message.textContent = "⬇️ Too high! Try a smaller number.";
  }

  guess.select();
}

function newGame() {
  secret = Math.floor(Math.random() * 100) + 1;
  attempts = 0;
  attemptsEl.textContent = "0";
  message.textContent = "New number chosen. Good luck, Warrior! ⚔️";
  guess.value = "";
  guess.focus();
}

document.getElementById("check").addEventListener("click", checkGuess);
document.getElementById("restart").addEventListener("click", newGame);

guess.addEventListener("keydown", (event) => {
  if (event.key === "Enter") checkGuess();
});

guess.focus();
</script>
</body>
</html>
